services:
  - type: web
    name: fraud-sentinel-dashboard
    env: static
    buildCommand: cd artifacts/fraud-dashboard && npm install && npm run build
    staticPublishPath: artifacts/fraud-dashboard/dist
    envVars:
      - key: VITE_API_URL
        value: https://fraud-9lts.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

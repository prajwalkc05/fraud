services:
  # Backend API Server
  - type: web
    name: fraud-sentinel-api
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-sentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://fraud-sentinel-dashboard.onrender.com
      - key: PORT
        value: 8080
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: hhr135696@gmail.com

  # Frontend Dashboard
  - type: web
    name: fraud-sentinel-dashboard
    runtime: static
    buildCommand: cd artifacts/fraud-dashboard && pnpm install && pnpm run build
    staticPublishPath: artifacts/fraud-dashboard/dist
    envVars:
      - key: VITE_API_URL
        value: https://fraud-sentinel-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Database
databases:
  - name: fraud-sentinel-db
    databaseName: fraud_sentinel
    plan: free
    region: oregon

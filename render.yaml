# Render Configuration - Backend API Only
# Frontend is deployed separately on Netlify

services:
  # Backend API Server
  - type: web
    name: fraud-sentinel-api
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-sentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://fraud-sentinel-dashboard.netlify.app
      - key: PORT
        value: 8080
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: hhr135696@gmail.com

# Database
databases:
  - name: fraud-sentinel-db
    databaseName: fraud_sentinel
    plan: free
    region: oregon

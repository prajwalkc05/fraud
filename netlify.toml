[build]
  base = "."
  command = "npm install -g pnpm && pnpm install --frozen-lockfile --ignore-scripts && pnpm run typecheck:libs && cd artifacts/fraud-dashboard && pnpm run build"
  publish = "artifacts/fraud-dashboard/dist/public"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  VITE_API_URL = "https://fraud-9lts.onrender.com/api"
  PNPM_VERSION = "9"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
